<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset password | ICHA AI Studio</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#090d18;color:#eef2ff;font:16px/1.6 system-ui,sans-serif}.card{width:min(100%,460px);padding:28px;border:1px solid #ffffff22;border-radius:18px;background:#141e31}h1{margin:0 0 8px;font-size:28px}p{color:#b9c5d8}label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #ffffff30;border-radius:9px;background:#0b1220;color:white;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#54e3d0;color:#07121b;font-weight:700;font:inherit;cursor:pointer}#message{min-height:26px;margin-top:14px;color:#a9e9d8}a{color:#70dfd0}</style></head>
<body><main class="card"><a href="/" style="color:#70dfd0;text-decoration:none">← ICHA AI Studio</a><h1>Reset your password</h1><p>Choose a new password for your ICHA AI Studio account.</p>
<form id="reset-form"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" required><button id="reset-button" type="submit">Save new password</button></form>
<p id="message" role="status" aria-live="polite"></p><p><a href="/">Return to sign in</a></p></main>
<script>
const params=new URLSearchParams(location.search),userId=params.get("userId")||"",secret=params.get("secret")||"";
const form=document.getElementById("reset-form"),message=document.getElementById("message"),button=document.getElementById("reset-button");
if(!userId||!secret){message.textContent="This reset link is incomplete. Request a new one from the sign-in page.";button.disabled=true;}
form.addEventListener("submit",async event=>{event.preventDefault();const password=document.getElementById("new-password").value,passwordAgain=document.getElementById("confirm-password").value;if(password!==passwordAgain){message.textContent="The passwords do not match.";return;}button.disabled=true;button.textContent="Saving…";message.textContent="";
try{const response=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({userId,secret,password,passwordAgain})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"Could not reset password.");message.textContent=data.message||"Password changed successfully.";form.hidden=true;history.replaceState({},"",location.pathname);}
catch(error){message.textContent=error.message;}finally{button.disabled=false;button.textContent="Save new password";}});
</script></body></html>
