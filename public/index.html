<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IchaBot Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>IchaBot</h1>
    <button id="logoutBtn" hidden>Sign out</button>
  </header>

  <main>
    <section id="auth">
      <h2>Welcome to IchaBot</h2>
      <p>Create an account or sign in.</p>

      <form id="authForm">
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" placeholder="Password (10 characters minimum)" minlength="10" required>
        <button type="submit" id="loginBtn">Sign in</button>
        <button type="button" id="registerBtn">Create account</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <h2>Your dashboard</h2>
      <p id="notice"></p>

      <section class="panel">
        <h3>Connect Facebook Page</h3>
        <button id="facebookBtn">Connect Facebook</button>
        <label for="pageSelect">Choose your Page</label>
        <select id="pageSelect">
          <option value="">No Page connected</option>
        </select>
        <button id="refreshBtn">Refresh Pages</button>
      </section>

      <section class="panel">
        <h3>Messenger automatic replies</h3>
        <input id="messageKeyword" placeholder="Keyword (leave blank for default)">
        <textarea id="messageReply" placeholder="Messenger reply"></textarea>
        <label><input type="checkbox" id="messageDefault"> Default reply</label>
        <label><input type="checkbox" id="messageWelcome"> Welcome reply</label>
        <button id="saveMessage">Save Messenger reply</button>
      </section>

      <section class="panel">
        <h3>Automatic comment replies</h3>
        <input id="commentKeyword" placeholder="Keyword (leave blank for default)">
        <textarea id="commentReply" placeholder="Public comment reply"></textarea>
        <label><input type="checkbox" id="commentDefault"> Default comment reply</label>
        <button id="saveComment">Save comment reply</button>
      </section>

      <section class="panel">
        <h3>Broadcast and schedule</h3>
        <textarea id="campaignMessage" placeholder="Write your broadcast message"></textarea>
        <label for="campaignTime">Date and time</label>
        <input id="campaignTime" type="datetime-local">
        <button id="scheduleBtn">Schedule broadcast</button>
      </section>

      <section class="panel">
        <h3>Campaign reports</h3>
        <button id="campaignRefresh">Refresh reports</button>
        <div id="campaignList"></div>
      </section>

      <section class="panel">
        <h3>Dashboard summary</h3>
        <button id="summaryRefresh">Refresh summary</button>
        <pre id="summary"></pre>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
